name: RDP by DucThang x TrueHieu (V7 - Chốt Hạ Tuyệt Đối)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for logs'
        required: false
      machine_id:
        description: 'Machine ID for logs'
        required: false
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-bore-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 1440

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ Setup Logging Helper
        shell: cmd
        run: |
          > report-log.ps1 echo param([string]$message)
          >> report-log.ps1 echo Write-Host "[SYSTEM LOG]: $message"
          >> report-log.ps1 echo $serverUrl = "${{ github.event.inputs.server_url }}"
          >> report-log.ps1 echo $machineId = "${{ github.event.inputs.machine_id }}"
          >> report-log.ps1 echo if ($serverUrl -and $machineId) {
          >> report-log.ps1 echo   try {
          >> report-log.ps1 echo     $body = @{ machineId = $machineId; message = $message } ^| ConvertTo-Json -Compress
          >> report-log.ps1 echo     Invoke-RestMethod -Uri "$serverUrl/api/machine-log" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 10 ^| Out-Null
          >> report-log.ps1 echo   } catch {
          >> report-log.ps1 echo     Write-Host "Failed to report log to server: $_"
          >> report-log.ps1 echo   }
          >> report-log.ps1 echo }

      - name: 📦 Install Python Dependencies
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "📥 Đang cài đặt Python packages..."
          python -m pip install --upgrade pip
          pip install telebot requests beautifulsoup4 pytz colorama tqdm urllib3 pathlib psutil python-telegram-bot bs4 fake-useragent gspread oauth2client httpx ddddocr gtts deep-translator selenium webdriver-manager pyperclip pyTelegramBotAPI cfonts pycryptodome dexron aiohttp websocket-client python-socketio flask pillow qrcode python-dotenv lequangminh lxml requests-html PyGithub pyyaml toml configparser cryptography pyOpenSSL certifi chardet idna six typing-extensions zope.interface twisted autobahn websockets dnspython async-timeout frozenlist multidict yarl aiosignal attrs pyasn1 pyasn1-modules rsa cachetools google-auth google-auth-oauthlib google-api-python-client
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ Đã cài đặt xong Python packages."

      - name: Download and Extract Bore
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "📥 Đang tải và giải nén Bore..."
          powershell -ExecutionPolicy Bypass -Command "Invoke-WebRequest -Uri 'https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-pc-windows-msvc.zip' -OutFile bore.zip; Expand-Archive bore.zip -DestinationPath bore"
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ Đã tải Bore."

      - name: Enable RDP + Create Admin User
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "👤 Cấu hình tài khoản Admin & RDP..."
          powershell -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0; Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'; $pass = ConvertTo-SecureString 'WindowsRDP2026@' -AsPlainText -Force; New-LocalUser 'admin' -Password $pass -FullName 'admin'; Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'admin'; Add-LocalGroupMember -Group 'Administrators' -Member 'admin'"
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ Tạo tài khoản admin thành công (Pass: WindowsRDP2026@)."

      - name: Tối ưu Registry 4K
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "🚀 Đang cấu hình Registry tối ưu RDP 4K/120FPS..."
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v fEnableVirtualizedGraphics /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services" /v MinFrameRate /t REG_DWORD /d 120 /f
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ Registry optimized."

      - name: 📥 Tải bot.py + call.py-call5.py + callsms.py-callsms11.py từ GitHub
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "📥 Đang tải bot.py + các file spam (call.py->call5.py, callsms.py->callsms11.py) từ repo..."
          powershell -ExecutionPolicy Bypass -Command "$baseRaw = 'https://raw.githubusercontent.com/Vhjkjfftf56774njjkkkjdss/Vhjkjfftf56774njjkkkj-/main'; $files = @('bot.py'); $files += @('call.py') + (2..5 | ForEach-Object { \"call$_.py\" }); $files += @('callsms.py') + (2..11 | ForEach-Object { \"callsms$_.py\" }); $ok = @(); $miss = @(); foreach ($f in $files) { try { Invoke-WebRequest -Uri \"$baseRaw/$f\" -OutFile $f -TimeoutSec 30 -ErrorAction Stop; $size = (Get-Item $f).Length; Write-Host \"[DL] OK: $f ($size bytes)\"; $ok += $f } catch { Write-Host \"[DL] MISS: $f - $($_.Exception.Message)\"; $miss += $f } }; Write-Host \"[DL] Tai thanh cong $($ok.Count)/$($files.Count) file\"; if ($miss.Count -gt 0) { powershell -ExecutionPolicy Bypass -File report-log.ps1 \"Canh bao: Tai $($ok.Count)/$($files.Count) file, thieu: $($miss -join ', ')\" } else { powershell -ExecutionPolicy Bypass -File report-log.ps1 \"Da tai du $($ok.Count) file\" }"

      - name: 🌐 Set UTF-8 Encoding
        shell: cmd
        run: |
          chcp 65001
          set PYTHONIOENCODING=utf-8
          set PYTHONUTF8=1
          echo PYTHONIOENCODING=utf-8>> %GITHUB_ENV%
          echo PYTHONUTF8=1>> %GITHUB_ENV%

      - name: 📦 Pip Install (ensure before run)
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "📦 Đảm bảo pip packages trước khi chạy bot..."
          python -m pip install --upgrade pip
          pip install telebot requests beautifulsoup4 pytz colorama tqdm urllib3 pathlib psutil python-telegram-bot bs4 fake-useragent gspread oauth2client httpx ddddocr gtts deep-translator selenium webdriver-manager pyperclip pyTelegramBotAPI cfonts pycryptodome dexron aiohttp websocket-client python-socketio flask pillow qrcode python-dotenv lequangminh lxml requests-html PyGithub pyyaml toml configparser cryptography pyOpenSSL certifi chardet idna six typing-extensions zope.interface twisted autobahn websockets dnspython async-timeout frozenlist multidict yarl aiosignal attrs pyasn1 pyasn1-modules rsa cachetools google-auth google-auth-oauthlib google-api-python-client
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ Pip packages sẵn sàng."

      - name: 🤖 Run bot.py + Monitor Bore Stream & Force Update File
        shell: cmd
        run: |
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "🤖 Khởi chạy bot.py ở chế độ background..."
          set PYTHONIOENCODING=utf-8
          set PYTHONUTF8=1
          start "" /b cmd /c "python bot.py > bot_stdout.log 2> bot_stderr.log"
          timeout /t 3 /nobreak >nul
          if exist bot_stdout.log type bot_stdout.log
          if exist bot_stderr.log type bot_stderr.log
          powershell -ExecutionPolicy Bypass -File report-log.ps1 "✅ bot.py đã khởi chạy ở background."

          powershell -ExecutionPolicy Bypass -File report-log.ps1 "🌐 Khởi chạy Bore stream..."

          git config --global user.name "TrueHieu-Bot"
          git config --global user.email "bot@trueteam.top"
          git config --global core.autocrlf false

          powershell -ExecutionPolicy Bypass -File report-log.ps1 "🔍 Đang kết nối Bore Server..."

          > bore-monitor.ps1 echo $PASS = "WindowsRDP2026@"
          >> bore-monitor.ps1 echo $USER = "admin"
          >> bore-monitor.ps1 echo $lastFullAddress = ""
          >> bore-monitor.ps1 echo $psi = New-Object System.Diagnostics.ProcessStartInfo
          >> bore-monitor.ps1 echo $psi.FileName = ".\bore\bore.exe"
          >> bore-monitor.ps1 echo $psi.Arguments = "local 3389 --to bore.pub"
          >> bore-monitor.ps1 echo $psi.UseShellExecute = $false
          >> bore-monitor.ps1 echo $psi.RedirectStandardOutput = $true
          >> bore-monitor.ps1 echo $process = [System.Diagnostics.Process]::Start($psi)
          >> bore-monitor.ps1 echo while (!$process.HasExited) {
          >> bore-monitor.ps1 echo     $line = $process.StandardOutput.ReadLine()
          >> bore-monitor.ps1 echo     if ($line) { Write-Host "[bore] $line" }
          >> bore-monitor.ps1 echo     if ($line -match "(?:listening at^|remote forwarding at) (bore\.pub:\d+)") {
          >> bore-monitor.ps1 echo         $fullAddress = $matches[1]
          >> bore-monitor.ps1 echo         $portOnly = $fullAddress.Split(':')[1]
          >> bore-monitor.ps1 echo         if ($fullAddress -ne $lastFullAddress) {
          >> bore-monitor.ps1 echo             $lastFullAddress = $fullAddress
          >> bore-monitor.ps1 echo             powershell -ExecutionPolicy Bypass -File report-log.ps1 "Mo port RDP thanh cong: $fullAddress"
          >> bore-monitor.ps1 echo             if (Test-Path "rdp_info.txt") { Remove-Item "rdp_info.txt" -Force }
          >> bore-monitor.ps1 echo             $createdAt = (Get-Date).ToString('HH:mm:ss dd/MM/yyyy')
          >> bore-monitor.ps1 echo             $reportLines = @('=======================================================','RDP INFO - DucThang x TrueHieu Edition','=======================================================',"FULL ADDRESS   : $fullAddress","PORT           : $portOnly",'HOST           : bore.pub','-------------------------------------------------------',"Username       : $USER","Password       : $PASS","Created        : $createdAt",'=======================================================')
          >> bore-monitor.ps1 echo             $report = ($reportLines -join "`r`n")
          >> bore-monitor.ps1 echo             [System.IO.File]::WriteAllText("$(Get-Location)\rdp_info.txt", $report)
          >> bore-monitor.ps1 echo             git checkout main
          >> bore-monitor.ps1 echo             git add rdp_info.txt
          >> bore-monitor.ps1 echo             git commit -m "Update RDP: $portOnly [skip ci]"
          >> bore-monitor.ps1 echo             git push origin main --force
          >> bore-monitor.ps1 echo             powershell -ExecutionPolicy Bypass -File report-log.ps1 "Da commit RDP len repo: $fullAddress"
          >> bore-monitor.ps1 echo         }
          >> bore-monitor.ps1 echo     }
          >> bore-monitor.ps1 echo     Start-Sleep -Milliseconds 200
          >> bore-monitor.ps1 echo }

          powershell -ExecutionPolicy Bypass -File bore-monitor.ps1
