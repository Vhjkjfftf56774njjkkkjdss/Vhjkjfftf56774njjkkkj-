name: Create VPS (Auto Restart)

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL for logs'
        required: false
      machine_id:
        description: 'Machine ID for logs'
        required: false
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-novnc-runner
  cancel-in-progress: true

env:
  VPS_NAME: vps-project-1777211676958
  BOT_REPO: Vhjkjfftf56774njjkkkjdss/Vhjkjfftf56774njjkkkj-

jobs:
  deploy:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: ⬇️ Checkout source
        uses: actions/checkout@v4

      - name: 🛠️ Setup Logging Helper
        shell: pwsh
        run: |
          $code = @'
          param([string]$message)
          Write-Host "[SYSTEM LOG]: $message"
          $serverUrl = "${{ github.event.inputs.server_url }}"
          $machineId = "${{ github.event.inputs.machine_id }}"
          if ($serverUrl -and $machineId) {
            try {
              $body = @{ machineId = $machineId; message = $message } | ConvertTo-Json -Compress
              Invoke-RestMethod -Uri "$serverUrl/api/machine-log" -Method Post -Body $body -ContentType "application/json" -TimeoutSec 10 | Out-Null
            } catch {
              Write-Host "Failed to report log to server: $_"
            }
          }
          '@
          $code | Out-File -FilePath "report-log.ps1" -Encoding UTF8

      - name: 🐍 Tạo file VPS info
        shell: pwsh
        run: |
          .\report-log.ps1 "📝 Khởi tạo metadata VPS..."
          mkdir -Force links
          "VPS khởi tạo - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath "links/$env:VPS_NAME.txt" -Encoding UTF8

      - name: 🖥️ Cài đặt và chạy TightVNC, noVNC, Cloudflared
        shell: pwsh
        run: |
          .\report-log.ps1 "📥 Bắt đầu cài đặt TightVNC, noVNC, và Cloudflared..."
          
          try {
            .\report-log.ps1 "📥 Đang tải TightVNC setup..."
            Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.63/tightvnc-2.8.63-gpl-setup-64bit.msi" -OutFile "tightvnc-setup.msi" -TimeoutSec 60
            .\report-log.ps1 "✅ Tải TightVNC thành công."
            
            .\report-log.ps1 "⚙️ Đang cài đặt TightVNC Server..."
            Start-Process msiexec.exe -Wait -ArgumentList '/i tightvnc-setup.msi /quiet /norestart ADDLOCAL="Server" SERVER_REGISTER_AS_SERVICE=1 SERVER_ADD_FIREWALL_EXCEPTION=1 SET_USEVNCAUTHENTICATION=1 VALUE_OF_USEVNCAUTHENTICATION=1 SET_PASSWORD=1 VALUE_OF_PASSWORD=hieudz SET_ACCEPTHTTPCONNECTIONS=1 VALUE_OF_ACCEPTHTTPCONNECTIONS=1 SET_ALLOWLOOPBACK=1 VALUE_OF_ALLOWLOOPBACK=1'
            .\report-log.ps1 "✅ Đã cài đặt TightVNC Server."
            
            .\report-log.ps1 "🔧 Kích hoạt kết nối loopback trong Registry..."
            Set-ItemProperty -Path "HKLM:\SOFTWARE\TightVNC\Server" -Name "AllowLoopback" -Value 1 -ErrorAction SilentlyContinue
            
            .\report-log.ps1 "🔍 Đang dừng các tiến trình VNC cũ..."
            Stop-Process -Name "tvnserver" -Force -ErrorAction SilentlyContinue
            Stop-Service -Name "tvnserver" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
            
            .\report-log.ps1 "🔍 Kiểm tra xung đột Port 5900..."
            $portCheck = netstat -aon | FindStr :5900
            if ($portCheck) {
              .\report-log.ps1 "⚠️ Port 5900 đang bận. Đang giải phóng..."
              Stop-Process -Id ($portCheck -split '\s+')[-1] -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            
            .\report-log.ps1 "🚀 Khởi chạy dịch vụ TightVNC Server..."
            Start-Process -FilePath "C:\Program Files\TightVNC\tvnserver.exe" -ArgumentList "-run -localhost no" -WindowStyle Hidden -RedirectStandardOutput "vnc_start.log" -RedirectStandardError "vnc_error.log"
            Start-Sleep -Seconds 40
            Get-Content "vnc_start.log" -ErrorAction SilentlyContinue | Write-Host
            Get-Content "vnc_error.log" -ErrorAction SilentlyContinue | Write-Host
            
            .\report-log.ps1 "🛡️ Cấu hình Firewall rules..."
            netsh advfirewall firewall add rule name="Allow VNC 5900" dir=in action=allow protocol=TCP localport=5900
            netsh advfirewall firewall add rule name="Allow noVNC 6080" dir=in action=allow protocol=TCP localport=6080
            .\report-log.ps1 "✅ Firewall configured."
            
            .\report-log.ps1 "🐍 Cài đặt Python dependencies cho websockify..."
            python --version | Write-Host
            python -m pip --version | Write-Host
            
            $maxPipAttempts = 5
            for ($i = 1; $i -le $maxPipAttempts; $i++) {
              try {
                .\report-log.ps1 "🐍 Chạy pip install (lần thử $i/$maxPipAttempts)..."
                python -m pip install --upgrade pip --timeout 60 2>&1 | Out-File -FilePath "pip_install.log" -Append -Encoding UTF8
                pip install --force-reinstall numpy novnc websockify==0.13.0 --timeout 60 2>&1 | Out-File -FilePath "pip_install.log" -Append -Encoding UTF8
                .\report-log.ps1 "✅ Cài đặt dependencies thành công."
                break
              } catch {
                .\report-log.ps1 "⚠️ Lỗi cài đặt pip, thử lại..."
                Get-Content "pip_install.log" -ErrorAction SilentlyContinue | Write-Host
                if ($i -eq $maxPipAttempts) {
                  .\report-log.ps1 "❌ Lỗi cài đặt dependencies!"
                  exit 1
                }
                Start-Sleep -Seconds 10
              }
            }
            
            $novncPath = "noVNC"
            .\report-log.ps1 "🔍 Kiểm tra noVNC qua pip..."
            try {
              $novncInfo = pip show novnc
              $novncPath = ($novncInfo | Select-String "Location: (.*)").Matches.Groups[1].Value + "\novnc"
              if (Test-Path "$novncPath") {
                if (-not (Test-Path "$novncPath/vnc.html")) {
                  throw "vnc.html not found"
                }
                .\report-log.ps1 "✅ Sử dụng noVNC được cài qua pip."
              } else {
                throw "noVNC path not found"
              }
            } catch {
              .\report-log.ps1 "🌐 Tải noVNC trực tiếp từ GitHub..."
              $novncVersion = "v1.6.0"
              $maxDownloadAttempts = 5
              for ($i = 1; $i -le $maxDownloadAttempts; $i++) {
                try {
                  Remove-Item -Recurse -Force noVNC -ErrorAction SilentlyContinue
                  $novncUrl = "https://github.com/novnc/noVNC/archive/refs/tags/$novncVersion.zip"
                  $response = Invoke-WebRequest -Uri $novncUrl -OutFile "noVNC.zip" -TimeoutSec 60 -PassThru
                  Expand-Archive -Path "noVNC.zip" -DestinationPath "." -Force
                  Move-Item -Path "noVNC-$($novncVersion.Substring(1))" -Destination "noVNC" -Force
                  .\report-log.ps1 "✅ Tải noVNC GitHub thành công."
                  $novncPath = "noVNC"
                  break
                } catch {
                  .\report-log.ps1 "⚠️ Lỗi tải noVNC GitHub ($i/$maxDownloadAttempts), thử lại..."
                  if ($i -eq $maxDownloadAttempts) {
                    .\report-log.ps1 "❌ Lỗi tải noVNC GitHub!"
                    exit 1
                  }
                  Start-Sleep -Seconds 10
                }
              }
            }
            
            if (-not (Test-Path "$novncPath/vnc.html")) {
              .\report-log.ps1 "❌ Thư mục noVNC không hoàn chỉnh!"
              exit 1
            }
            
            .\report-log.ps1 "🔍 Kiểm tra xung đột Port 6080..."
            $portCheck = netstat -aon | FindStr :6080
            if ($portCheck) {
              .\report-log.ps1 "⚠️ Port 6080 đang bận. Đang giải phóng..."
              Stop-Process -Id ($portCheck -split '\s+')[-1] -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
            }
            
            .\report-log.ps1 "🚀 Khởi chạy websockify..."
            Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", "$novncPath", "--verbose" -RedirectStandardOutput "websockify.log" -RedirectStandardError "websockify_error.log" -NoNewWindow -PassThru
            Start-Sleep -Seconds 15
            
            .\report-log.ps1 "📥 Tải Cloudflared..."
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe" -TimeoutSec 60
            .\report-log.ps1 "✅ Đã tải Cloudflared."
            
            .\report-log.ps1 "🌐 Khởi tạo Cloudflared tunnel..."
            Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:6080", "--no-autoupdate", "--edge-ip-version", "auto", "--protocol", "http2", "--logfile", "cloudflared.log" -WindowStyle Hidden
            Start-Sleep -Seconds 40
            
            .\report-log.ps1 "🌐 Đang truy quét địa chỉ Cloudflared URL..."
            $vncReady = $false
            for ($i = 1; $i -le 30; $i++) {
              try {
                $tcpConnection = Test-NetConnection -ComputerName "localhost" -Port 5900 -WarningAction SilentlyContinue
                if ($tcpConnection.TcpTestSucceeded) {
                  $vncTest = New-Object System.Net.Sockets.TcpClient
                  $vncTest.Connect("127.0.0.1", 5900)
                  $vncTest.Close()
                  $vncReady = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 2
            }
            
            if (-not $vncReady) {
              .\report-log.ps1 "❌ VNC server không phản hồi!"
              exit 1
            }
            
            $websockifyReady = $false
            for ($i = 1; $i -le 3; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://localhost:6080/vnc.html" -TimeoutSec 5 -UseBasicParsing -ErrorAction Stop
                $websockifyReady = $true
                break
              } catch {
                Stop-Process -Name "python" -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 5
                Start-Process -FilePath "python" -ArgumentList "-m", "websockify", "6080", "127.0.0.1:5900", "--web", "$novncPath", "--verbose" -RedirectStandardOutput "websockify.log" -RedirectStandardError "websockify_error.log" -NoNewWindow -PassThru
                Start-Sleep -Seconds 15
              }
            }
            
            if (-not $websockifyReady) {
              .\report-log.ps1 "❌ Websockify không khởi động được!"
              exit 1
            }
            
            $maxAttempts = 180
            $attempt = 0
            $cloudflaredUrl = ""
            
            do {
              $attempt++
              Start-Sleep -Seconds 3
              
              if (Test-Path "cloudflared.log") {
                try {
                  $logContent = Get-Content "cloudflared.log" -Raw -ErrorAction SilentlyContinue
                  if ($logContent -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
                    $cloudflaredUrl = $matches[0]
                    .\report-log.ps1 "✅ Đã nhận tunnel URL từ Cloudflare."
                    break
                  }
                } catch {}
              }
              
              if ($attempt % 20 -eq 0) {
                .\report-log.ps1 "🔄 Khởi động lại Cloudflared..."
                Stop-Process -Name "cloudflared" -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 3
                Start-Process -FilePath "cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:6080", "--no-autoupdate", "--edge-ip-version", "auto", "--protocol", "http2", "--logfile", "cloudflared.log" -WindowStyle Hidden
                Start-Sleep -Seconds 40
              }
            } while ($attempt -lt $maxAttempts)
            
            if ($cloudflaredUrl) {
              $remoteLink = "$cloudflaredUrl/vnc.html"
              .\report-log.ps1 "🌌 Remote URL: $remoteLink"
              
              $createdAt = (Get-Date).ToString('yyyy-MM-dd HH:mm:ss')
              $reportLines = @(
                '=======================================================',
                'noVNC INFO - DucThang x TrueHieu Edition',
                '=======================================================',
                "URL       : $remoteLink",
                'Password  : hieudz',
                'Host      : trycloudflare',
                'Protocol  : noVNC over Cloudflared',
                "Created   : $createdAt",
                '======================================================='
              )
              $report = ($reportLines -join "`r`n")
              [System.IO.File]::WriteAllText("$(Get-Location)\remote-link.txt", $report)
              
              try {
                git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git config --global user.name "github-actions[bot]"
                git add remote-link.txt
                git commit -m "🔗 Updated remote-link.txt - $createdAt" --allow-empty
                git push origin main --force-with-lease
                .\report-log.ps1 "✅ Đã commit thông tin máy lên GitHub."
              } catch {
                .\report-log.ps1 "⚠️ Lỗi commit thông tin máy lên GitHub!"
              }
            } else {
              .\report-log.ps1 "❌ Không lấy được tunnel URL từ Cloudflare!"
              "TUNNEL_FAILED_$(Get-Date -Format 'yyyyMMdd_HHmmss')" | Out-File -FilePath "remote-link.txt" -Encoding UTF8 -NoNewline
              
              git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git config --global user.name "github-actions[bot]"
              git add remote-link.txt
              git commit -m "❌ Tunnel failed - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
              git push origin main --force-with-lease
            }
          } catch {
            .\report-log.ps1 "❌ Quá trình chạy bị lỗi: $_"
            exit 1
          }
          
          .\report-log.ps1 "🚀 VPS Khởi động hoàn tất!"

      # ═══════════════════════════════════════════════════════════
      # CÀI ĐẶT PYTHON 3.11, 3.12, 3.13, 3.14 BẰNG setup-python
      # ═══════════════════════════════════════════════════════════

      - name: 🐍 Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: 🐍 Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: 🐍 Cài đặt Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: 🐍 Cài đặt Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: 📦 Cài đặt pip dependencies cho cả 4 phiên bản Python
        shell: pwsh
        run: |
          .\report-log.ps1 "📦 Bắt đầu cài đặt pip dependencies cho cả 4 phiên bản Python..."
          
          # Danh sách đầy đủ packages
          $packages = @(
            "telebot", "requests", "beautifulsoup4", "pytz", "colorama", "tqdm",
            "urllib3", "pathlib", "psutil", "python-telegram-bot", "bs4",
            "fake-useragent", "gspread", "oauth2client", "httpx", "ddddocr",
            "gtts", "deep-translator", "selenium", "webdriver-manager", "pyperclip",
            "pyTelegramBotAPI", "cfonts", "pycryptodome", "dexron", "aiohttp",
            "websocket-client", "python-socketio", "flask", "pillow", "qrcode",
            "python-dotenv", "lequangminh", "lxml", "requests-html", "PyGithub",
            "pyyaml", "toml", "configparser", "cryptography", "pyOpenSSL",
            "certifi", "chardet", "idna", "six", "typing-extensions",
            "zope.interface", "twisted", "autobahn", "websockets", "dnspython",
            "async-timeout", "frozenlist", "multidict", "yarl", "aiosignal",
            "attrs", "pyasn1", "pyasn1-modules", "rsa", "cachetools",
            "google-auth", "google-auth-oauthlib", "google-api-python-client",
            "cloudscraper"
          )
          $packagesStr = $packages -join " "
          
          # Tìm tất cả python.exe trong toolchain cache
          $pythonExes = @()
          $toolchainDirs = Get-ChildItem -Path "$env:RUNNER_TOOL_CACHE\Python" -Directory -ErrorAction SilentlyContinue
          if ($toolchainDirs) {
            foreach ($dir in $toolchainDirs) {
              $pyExe = Join-Path $dir.FullName "x64\python.exe"
              if (Test-Path $pyExe) {
                $ver = $dir.Name
                $pythonExes += @{ Version = $ver; Exe = $pyExe }
                .\report-log.ps1 "🔍 Tìm thấy Python $ver tại: $pyExe"
              }
            }
          }
          
          # Fallback: tìm trong PATH
          if ($pythonExes.Count -eq 0) {
            .\report-log.ps1 "⚠️ Không tìm thấy Python trong toolchain, tìm trên PATH..."
            $allPythons = Get-Command python* -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^python' }
            foreach ($py in $allPythons) {
              $pythonExes += @{ Version = "unknown"; Exe = $py.Source }
              .\report-log.ps1 "🔍 Tìm thấy: $($py.Source)"
            }
          }
          
          if ($pythonExes.Count -eq 0) {
            # Cuối cùng dùng python mặc định
            $pythonExes = @(@{ Version = "default"; Exe = "python" })
          }
          
          foreach ($py in $pythonExes) {
            $ver = $py.Version
            $exe = $py.Exe
            .\report-log.ps1 "📦 Cài đặt pip cho Python $ver ($exe)..."
            
            # Upgrade pip
            & $exe -m pip install --upgrade pip --timeout 120 2>&1 | Out-Null
            
            # Cài tất cả packages
            & $exe -m pip install $packagesStr --timeout 120 2>&1 | Out-File -FilePath "pip_${ver}.log" -Encoding UTF8
            if ($LASTEXITCODE -eq 0) {
              .\report-log.ps1 "✅ Python ${ver}: Tất cả packages cài đặt thành công."
            } else {
              .\report-log.ps1 "⚠️ Python ${ver}: Batch install có lỗi, cài từng package..."
              foreach ($pkg in $packages) {
                & $exe -m pip install $pkg --timeout 60 2>&1 | Out-Null
              }
              .\report-log.ps1 "✅ Python ${ver}: Đã cài xong từng package (bỏ qua lỗi)."
            }
          }
          
          .\report-log.ps1 "✅ Hoàn tất cài đặt pip cho tất cả phiên bản Python!"

      - name: 📥 Tải bot.py (spam.py) và 1.py-10.py từ GitHub
        shell: pwsh
        run: |
          .\report-log.ps1 "📥 Đang tải bot files từ GitHub repo..."
          
          $repoRaw = "https://raw.githubusercontent.com/$env:BOT_REPO/main"
          
          # Tải spam.py -> bot.py
          .\report-log.ps1 "📥 Tải spam.py -> bot.py..."
          $maxDl = 5
          for ($i = 1; $i -le $maxDl; $i++) {
            try {
              Invoke-WebRequest -Uri "$repoRaw/spam.py" -OutFile "bot.py" -TimeoutSec 60
              .\report-log.ps1 "✅ Tải bot.py thành công ($((Get-Item bot.py).Length) bytes)."
              break
            } catch {
              .\report-log.ps1 "⚠️ Lỗi tải bot.py (lần $i/$maxDl): $_"
              if ($i -eq $maxDl) { .\report-log.ps1 "❌ Không tải được bot.py!"; exit 1 }
              Start-Sleep -Seconds 10
            }
          }
          
          # Tải 1.py đến 11.py
          $failedFiles = @()
          for ($n = 1; $n -le 11; $n++) {
            $fileName = "$n.py"
            .\report-log.ps1 "📥 Tải $fileName..."
            for ($i = 1; $i -le $maxDl; $i++) {
              try {
                Invoke-WebRequest -Uri "$repoRaw/$fileName" -OutFile $fileName -TimeoutSec 60
                .\report-log.ps1 "✅ Tải $fileName thành công ($((Get-Item $fileName).Length) bytes)."
                break
              } catch {
                if ($i -eq $maxDl) {
                  .\report-log.ps1 "⚠️ Không tải được $fileName sau $maxDl lần thử."
                  $failedFiles += $fileName
                }
                Start-Sleep -Seconds 5
              }
            }
          }
          
          # Báo cáo
          .\report-log.ps1 "📊 Tóm tắt tải file:"
          .\report-log.ps1 "   bot.py: $((Get-Item bot.py).Length) bytes"
          for ($n = 1; $n -le 11; $n++) {
            if (Test-Path "$n.py") {
              .\report-log.ps1 "   $n.py: $((Get-Item "$n.py").Length) bytes"
            } else {
              .\report-log.ps1 "   $n.py: THIẾU!"
            }
          }
          
          if ($failedFiles.Count -gt 0) {
            .\report-log.ps1 "⚠️ Các file thiếu: $($failedFiles -join ', ')"
          }
          
          # Validate bot.py
          if (-not (Test-Path "bot.py") -or (Get-Item bot.py).Length -lt 100) {
            .\report-log.ps1 "❌ bot.py không hợp lệ!"
            exit 1
          }
          
          .\report-log.ps1 "✅ Tất cả bot files đã sẵn sàng."

      - name: 🤖 Test bot.py bằng Python 3.12 (bắt lỗi sớm)
        shell: pwsh
        run: |
          .\report-log.ps1 "🤖 Test bot.py bằng Python 3.12 trước khi chạy nền..."
          
          # Tìm Python 3.12 trong toolchain cache
          $py312 = $null
          $candidates = @(
            "$env:RUNNER_TOOL_CACHE\Python\3.12.*\x64\python.exe",
            "C:\hostedtoolcache\windows\Python\3.12.*\x64\python.exe"
          )
          foreach ($pattern in $candidates) {
            $found = Get-Item $pattern -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $py312 = $found.FullName; break }
          }
          if (-not $py312) {
            $py312 = & py -3.12 -c "import sys; print(sys.executable)" 2>$null
            if (-not $py312 -or $py312 -notmatch "3\.12") { $py312 = "python" }
          }
          
          .\report-log.ps1 "🐍 Python 3.12: $py312"
          & $py312 --version 2>&1 | Write-Host
          
          # Lưu path
          $py312 | Out-File -FilePath "py312_path.txt" -Encoding UTF8 -NoNewline
          
          # Test import các module quan trọng
          .\report-log.ps1 "🔍 Kiểm tra imports..."
          $testCode = @'
          import sys
          print(f"Python {sys.version}")
          print(f"Executable: {sys.executable}")
          modules = [
              "requests", "telebot", "cloudscraper", "dns.resolver",
              "fake_useragent", "bs4", "pytz", "colorama", "tqdm",
              "psutil", "httpx", "aiohttp", "flask", "pillow",
              "qrcode", "lxml", "yaml", "toml", "cryptography"
          ]
          ok = []
          fail = []
          for m in modules:
              try:
                  __import__(m)
                  ok.append(m)
              except Exception as e:
                  fail.append(f"{m}: {e}")
          print(f"OK ({len(ok)}): {', '.join(ok)}")
          if fail:
              print(f"FAILED ({len(fail)}):")
              for f in fail:
                  print(f"  ❌ {f}")
              sys.exit(1)
          else:
              print("✅ Tất cả imports thành công!")
          '@
          $testCode | Out-File -FilePath "test_imports.py" -Encoding UTF8
          
          $testResult = & $py312 test_imports.py 2>&1
          $testResult | ForEach-Object {
            .\report-log.ps1 "   $_"
            Write-Host $_
          }
          if ($LASTEXITCODE -ne 0) {
            .\report-log.ps1 "❌ Có lỗi import! Bot có thể không chạy được."
          }
          
          # Test chạy bot.py trong 15 giây để bắt lỗi
          .\report-log.ps1 "🧪 Chạy bot.py test trong 15 giây..."
          $botTest = Start-Process -FilePath $py312 -ArgumentList "bot.py" -WorkingDirectory (Get-Location) -NoNewWindow -PassThru -RedirectStandardOutput "bot_test_stdout.log" -RedirectStandardError "bot_test_stderr.log"
          Start-Sleep -Seconds 15
          
          if (-not $botTest.HasExited) {
            .\report-log.ps1 "✅ bot.py đang chạy sau 15 giây - OK!"
            Stop-Process -Id $botTest.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          } else {
            $exitCode = $botTest.ExitCode
            .\report-log.ps1 "⚠️ bot.py đã thoát sau $($botTest.ExitCode) giây với mã: $exitCode"
            .\report-log.ps1 "📋 STDOUT:"
            if (Test-Path "bot_test_stdout.log") {
              Get-Content "bot_test_stdout.log" -ErrorAction SilentlyContinue | Select-Object -Last 30 | ForEach-Object { .\report-log.ps1 "   $_" }
            }
            .\report-log.ps1 "📋 STDERR:"
            if (Test-Path "bot_test_stderr.log") {
              Get-Content "bot_test_stderr.log" -ErrorAction SilentlyContinue | Select-Object -Last 50 | ForEach-Object { .\report-log.ps1 "   ❌ $_" }
            }
            .\report-log.ps1 "⚠️ Bot có lỗi nhưng sẽ vẫn chạy nền với auto-restart."
          }
          
          .\report-log.ps1 "🤖 Hoàn tất test bot.py!"

      - name: 🚀 Khởi chạy bot.py nền với auto-restart
        shell: pwsh
        run: |
          .\report-log.ps1 "🚀 Khởi chạy bot.py nền với auto-restart..."
          
          $py312 = Get-Content "py312_path.txt" -Raw -ErrorAction SilentlyContinue
          if (-not $py312 -or -not (Test-Path $py312.Trim())) { $py312 = "python" }
          else { $py312 = $py312.Trim() }
          
          # Tạo script auto-restart với lock file
          $botScript = @'
          param([string]$PythonExe)
          $botFile = "bot.py"
          $lockFile = "bot_runner.lock"
          $maxRetries = 999
          
          # Lock file để chống overlap
          if (Test-Path $lockFile) {
            $oldPid = Get-Content $lockFile -Raw -ErrorAction SilentlyContinue
            $oldPid = $oldPid.Trim()
            if ($oldPid -and (Get-Process -Id $oldPid -ErrorAction SilentlyContinue)) {
              Write-Host "[BOT] Đã có runner khác đang chạy (PID $oldPid). Thoát."
              exit 0
            }
          }
          $PID | Out-File -FilePath $lockFile -Encoding UTF8 -NoNewline
          
          try {
            for ($i = 1; $i -le $maxRetries; $i++) {
                $timestamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
                Write-Host "[$timestamp] [BOT] Khởi động bot.py (lần $i) - $PythonExe"
                
                # Xoá log cũ
                if (Test-Path "bot_stdout.log") { Remove-Item "bot_stdout.log" -Force }
                if (Test-Path "bot_stderr.log") { Remove-Item "bot_stderr.log" -Force }
                
                # Chạy bot
                $proc = Start-Process -FilePath $PythonExe -ArgumentList $botFile -WorkingDirectory (Get-Location) -NoNewWindow -PassThru -RedirectStandardOutput "bot_stdout.log" -RedirectStandardError "bot_stderr.log"
                $proc.WaitForExit()
                $exitCode = $proc.ExitCode
                
                # Append stderr vào bot_crash.log (persistent, không xoá)
                if (Test-Path "bot_stderr.log") {
                  Add-Content -Path "bot_crash.log" -Value "=== Crash lúc $timestamp (exit $exitCode) ===" -Encoding UTF8
                  Get-Content "bot_stderr.log" -ErrorAction SilentlyContinue | Add-Content -Path "bot_crash.log" -Encoding UTF8
                }
                
                Write-Host "[$timestamp] [BOT] Thoát mã: $exitCode"
                if (Test-Path "bot_stderr.log") {
                  Get-Content "bot_stderr.log" -ErrorAction SilentlyContinue | Select-Object -Last 10 | ForEach-Object { Write-Host "[BOT ERR] $_" }
                }
                
                Write-Host "[BOT] Restart sau 10 giây..."
                Start-Sleep -Seconds 10
            }
          } finally {
            Remove-Item $lockFile -Force -ErrorAction SilentlyContinue
          }
          '@
          $botScript | Out-File -FilePath "run-bot.ps1" -Encoding UTF8
          
          # Xoá lock cũ
          Remove-Item "bot_runner.lock" -Force -ErrorAction SilentlyContinue
          
          # Khởi chạy runner trong nền
          Start-Process -FilePath "powershell" -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "run-bot.ps1", "-PythonExe", $py312 -WindowStyle Hidden -RedirectStandardOutput "bot_runner.log" -RedirectStandardError "bot_runner_error.log"
          Start-Sleep -Seconds 15
          
          # Kiểm tra
          $botProc = Get-Process -Name "python" -ErrorAction SilentlyContinue
          if ($botProc) {
            .\report-log.ps1 "✅ bot.py đang chạy (PID $($botProc.Id -join ','))!"
          } else {
            .\report-log.ps1 "⚠️ bot.py chưa chạy. Log gần nhất:"
            if (Test-Path "bot_stderr.log") { Get-Content "bot_stderr.log" -ErrorAction SilentlyContinue | Select-Object -Last 10 | ForEach-Object { .\report-log.ps1 "   ❌ $_" } }
            if (Test-Path "bot_crash.log") { Get-Content "bot_crash.log" -ErrorAction SilentlyContinue | Select-Object -Last 10 | ForEach-Object { .\report-log.ps1 "   💥 $_" } }
            if (Test-Path "bot_runner_error.log") { Get-Content "bot_runner_error.log" -ErrorAction SilentlyContinue | Select-Object -Last 5 | ForEach-Object { .\report-log.ps1 "   ⚙️ $_" } }
          }
          
          .\report-log.ps1 "🚀 Hoàn tất khởi chạy bot.py!"

      - name: ♻️ Giữ VPS sống (Keep-Alive Loop)
        shell: pwsh
        run: |
          .\report-log.ps1 "🚀 VPS Khởi động hoàn tất!"
          
          mkdir -Force ".backup"
          
          $totalMinutes = 330
          $restartCheckpoint = 320
          $backupInterval = 60
          
          # Đọc đường dẫn Python 3.12
          $py312 = "python"
          if (Test-Path "py312_path.txt") {
            $savedPath = Get-Content "py312_path.txt" -Raw -ErrorAction SilentlyContinue
            if ($savedPath -and (Test-Path $savedPath.Trim())) {
              $py312 = $savedPath.Trim()
            }
          }
          
          for ($i = 1; $i -le $totalMinutes; $i++) {
            $currentTime = Get-Date -Format 'HH:mm:ss'
            .\report-log.ps1 "🟢 VPS đang chạy - Phút $i/$totalMinutes ($currentTime)"
            
            # Kiểm tra bot: chỉ restart nếu KHÔNG có run-bot.ps1 chạy (tránh overlap)
            $runnerActive = $false
            if (Test-Path "bot_runner.lock") {
              $lockPid = (Get-Content "bot_runner.lock" -Raw -ErrorAction SilentlyContinue).Trim()
              if ($lockPid -and (Get-Process -Id $lockPid -ErrorAction SilentlyContinue)) {
                $runnerActive = $true
              }
            }
            # Cũng check xem có powershell process nào đang chạy run-bot.ps1 không
            if (-not $runnerActive) {
              $psProcs = Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" -ErrorAction SilentlyContinue
              foreach ($p in $psProcs) {
                if ($p.CommandLine -match "run-bot\.ps1") { $runnerActive = $true; break }
              }
            }
            
            if (-not $runnerActive) {
              .\report-log.ps1 "⚠️ Bot runner đã chết! Khởi động lại..."
              Remove-Item "bot_runner.lock" -Force -ErrorAction SilentlyContinue
              if (Test-Path "run-bot.ps1") {
                Start-Process -FilePath "powershell" -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "run-bot.ps1", "-PythonExe", $py312 -WindowStyle Hidden -RedirectStandardOutput "bot_runner.log" -RedirectStandardError "bot_runner_error.log"
                Start-Sleep -Seconds 10
                .\report-log.ps1 "✅ Đã khởi động lại bot runner"
              }
            } else {
              # Bot runner đang hoạt động, log crash gần nhất nếu có
              if (Test-Path "bot_crash.log") {
                $crashSize = (Get-Item "bot_crash.log").Length
                if ($crashSize -gt 0 -and ($i % 10 -eq 0)) {
                  $lastCrash = Get-Content "bot_crash.log" -Tail 3 -ErrorAction SilentlyContinue
                  .\report-log.ps1 "💥 Bot crash gần nhất: $($lastCrash -join ' | ')"
                }
              }
            }
            
            if ($i % $backupInterval -eq 0) {
              .\report-log.ps1 "💾 Đang sao lưu dữ liệu..."
              $filesToBackup = @()
              if (Test-Path "links") { $filesToBackup += "links" }
              if (Test-Path "remote-link.txt") { $filesToBackup += "remote-link.txt" }
              if (Test-Path "*.log") { $filesToBackup += Get-ChildItem -Filter "*.log" | Select-Object -ExpandProperty Name }
              
              if ($filesToBackup.Count -gt 0) {
                try {
                  $backupName = "$env:VPS_NAME`_$(Get-Date -Format 'yyyyMMdd_HHmm').zip"
                  Compress-Archive -Path $filesToBackup -DestinationPath ".backup/$backupName" -Force
                  
                  git add .backup/$backupName
                  git commit -m "💾 Backup - $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" --allow-empty
                  git push origin main --force-with-lease
                  .\report-log.ps1 "✅ Sao lưu thành công: $backupName"
                } catch {
                  .\report-log.ps1 "⚠️ Sao lưu thất bại."
                }
              }
            }
            
            if ($i -eq $restartCheckpoint) {
              .\report-log.ps1 "🔁 Chuẩn bị khởi động lại sau $($totalMinutes - $i) phút..."
            }
            
            Start-Sleep -Seconds 60
          }
          
          .\report-log.ps1 "⏰ Phiên hoạt động hoàn tất. Hệ thống sẽ tự động khởi động lại sau 5h."
